name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: telecom-twin experiment --output-dir /tmp/telecom-twin-results
      - run: telecom-twin benchmark --output-dir /tmp/telecom-twin-benchmark --trials-per-root 2
      - run: telecom-twin online-evaluation --output-dir /tmp/telecom-twin-online
      - run: telecom-twin multi-fault-benchmark --output-dir /tmp/telecom-twin-multifault --trials-per-scenario 2
      - run: telecom-twin demo-gif --output /tmp/telecom-twin-demo.gif
      - run: scripts/api_smoke.sh
